name: Deploy PreLab to GitHub Pages

on:
  push:
    branches: ["claude/skills-plugins-setup-imq071"]
    paths:
      - "PreLab/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; let an in-progress run finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source = GitHub Actions) if it isn't already
          enablement: true

      - name: Upload site artifact (PreLab app as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "PreLab"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
